#!/bin/bash
#
# Study definition (proposed replacement for test_table_READ_ONLY.dat)
#
# Instead of hand-aligned parallel arrays (one entry per case, repeated for
# every scheme), describe the study by:
#   - study    : one line per study (time controls)
#   - defaults : settings shared by every case
#   - axis     : the parameters being varied; cases are the cartesian
#                product of all axes, so adding a scheme or a mesh level is
#                one word, not eight edits across eight arrays.
#
# Expand into the legacy arrays used by Test.sh/plot.sh with:
#   ./expandTable.sh test.conf > test_table.dat
#
# Values containing spaces must be quoted, e.g. 'limitedLinear 1'.

description="For two N_iters, do rezone+remap at four mesh levels, for
18 div(meshPhi,p) schemes"

#
# Studies:  study <name> endTime=<..> deltaT=<..> writeInterval=<..> [nRemap=<..>]
#
study 100 endTime=100 deltaT=1 writeInterval=10 nRemap=100
study 10  endTime=10  deltaT=1 writeInterval=1  nRemap=10

#
# Defaults for every case (any key may also be used as an axis below)
#
defaults \
    M=1 \
    gradX=1 gradY=1 \
    ddt=backward \
    grad1=Gauss grad2=linear \
    alpha=0.25     # omit to use the solver default

#
# Axes: axis <key> <value> [<value> ...]
# Order matters: the first axis varies slowest; case names are built from
# the mesh and the remaining non-mesh axes.
#
axis meshPhi 'linear' 'limitedLinear 1'
axis mesh    15x16 30x32 60x64 120x128   # Lipnikov and Shashkov, nX x nY
